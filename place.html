<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장소 · 숨은 속초</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E6ECF7'/><path d='M5 20L13 8.5L18.5 15L21.2 12.4L27 20' fill='none' stroke='%231C3F94' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M5.5 24.4c2.2-1.7 4.3-1.7 6.5 0s4.3 1.7 6.5 0 4.3-1.7 6.5 0' fill='none' stroke='%231C3F94' stroke-width='2.2' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=Gothic+A1:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar over-scene">
    <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="mk-bg" width="32" height="32" rx="8"/><path class="mk-fg" d="M5 20L13 8.5L18.5 15L21.2 12.4L27 20" stroke-width="2.6" stroke-linejoin="round"/><path class="mk-fg" d="M5.5 24.4c2.2-1.7 4.3-1.7 6.5 0s4.3 1.7 6.5 0 4.3-1.7 6.5 0" stroke-width="2.2"/></svg><span class="brand-word">숨은 속초</span></a>
  </header>
  <main>
    <!-- 위쪽: 첫 화면과 같은 바다 장면 위에 이름과 그날의 숫자 (2026-11-26 성형) -->
    <section class="scene detail-head on-dark">
      <div class="scene-sea" aria-hidden="true"><canvas id="sea" data-mode="night"></canvas></div>
      <a class="back" href="index.html">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M17 7H2M8 1L2 7l6 6"/></svg>목록으로</a>
      <div id="detail-head" class="reveal"></div>
    </section>
    <div class="detail-layout">
      <div class="detail-main">
        <div id="detail" class="detail-body reveal"></div>
        <section id="nearby-section" class="similar reveal" hidden>
          <h2 class="section-title">근처 맛집 · 카페</h2>
          <ul id="nearby-list" class="rows stagger"></ul>
        </section>
        <section id="similar-section" class="similar reveal" hidden>
          <h2 class="section-title">여기 사람 많으면 여기로</h2>
          <ul id="similar-list" class="rows stagger"></ul>
        </section>
      </div>
      <!-- 넓은 화면(태블릿·PC)에서는 오른쪽에 지도를 고정. 좁은 화면에서는 정보 아래 -->
      <aside id="map" class="detail-map" hidden></aside>
    </div>
  </main>
  <footer class="footer"><p>한국관광공사 · 기상청 공공데이터 · 실시간이 아닌 예측</p></footer>

  <script src="data/tags.js"></script>
  <script src="data/places.js"></script>
  <script src="data/auto-places.js"></script>
  <script src="data/crowd-data.js"></script>
  <script src="data/tour-data.js"></script>
  <script src="data/descriptions.js"></script>
  <script src="data/sns-data.js"></script>
  <script src="data/weather-data.js"></script>
  <script src="js/places-all.js"></script>
  <script src="js/crowd.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/place.js"></script>
  <script src="js/sea.js"></script>
</body>
</html>
