<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>속초 관광 쏠림 요약 · 숨은 속초</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E6ECF7'/><path d='M5 20L13 8.5L18.5 15L21.2 12.4L27 20' fill='none' stroke='%231C3F94' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M5.5 24.4c2.2-1.7 4.3-1.7 6.5 0s4.3 1.7 6.5 0 4.3-1.7 6.5 0' fill='none' stroke='%231C3F94' stroke-width='2.2' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=Gothic+A1:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar over-scene">
    <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="mk-bg" width="32" height="32" rx="8"/><path class="mk-fg" d="M5 20L13 8.5L18.5 15L21.2 12.4L27 20" stroke-width="2.6" stroke-linejoin="round"/><path class="mk-fg" d="M5.5 24.4c2.2-1.7 4.3-1.7 6.5 0s4.3 1.7 6.5 0 4.3-1.7 6.5 0" stroke-width="2.2"/></svg><span class="brand-word">숨은 속초</span></a>
  </header>

  <header class="scene summary-head">
    <div class="scene-sea" aria-hidden="true"><canvas id="sea" data-mode="night"></canvas></div>
    <a class="back" href="index.html">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M17 7H2M8 1L2 7l6 6"/></svg>추천 화면으로</a>
    <h1 class="logo">속초 관광 쏠림</h1>
    <p class="intro">어디에 언제 몰리나 · 어디로 돌리나</p>
  </header>

  <main class="page">
    <section class="section panel panel-wide">
      <h2 class="section-title">유명한 곳 쏠림</h2>
      <p class="share"><span id="hero-share" class="hero-number"></span></p>
      <p id="hero-caption" class="muted"></p>
    </section>

    <section class="section panel">
      <h2 class="section-title">월별 방문자</h2>
      <p id="monthly-caption" class="muted"></p>
      <div id="monthly-chart" class="chart"></div>
      <details class="table-view">
        <summary>표로 보기</summary>
        <table id="monthly-table"></table>
      </details>
    </section>

    <section class="section panel">
      <h2 class="section-title">요일별 방문자</h2>
      <p id="weekday-caption" class="muted"></p>
      <div id="weekday-chart" class="chart"></div>
      <details class="table-view">
        <summary>표로 보기</summary>
        <table id="weekday-table"></table>
      </details>
    </section>

    <section class="section panel panel-wide">
      <h2 class="section-title">먼저 보여 주는 곳</h2>
      <p class="muted">길찾기로 많이 찾는 곳과 숨은 속초가 먼저 보여 주는 곳</p>
      <div class="compare">
        <div>
          <h3 class="compare-title">길찾기로 가장 많이 찾는 5곳</h3>
          <ol id="famous-list" class="compare-list"></ol>
        </div>
        <div>
          <h3 class="compare-title">숨은 속초 추천 첫 5곳</h3>
          <ul id="recommended-list" class="compare-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>한국관광공사 공공데이터 · <span id="summary-generated"></span></p>
  </footer>

  <script src="data/tags.js"></script>
  <script src="data/places.js"></script>
  <script src="data/auto-places.js"></script>
  <script src="data/crowd-data.js"></script>
  <script src="data/tour-data.js"></script>
  <script src="data/descriptions.js"></script>
  <script src="data/sns-data.js"></script>
  <script src="data/weather-data.js"></script>
  <script src="js/places-all.js"></script>
  <script src="data/visitor-data.js"></script>
  <script src="js/crowd.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/sea.js"></script>
</body>
</html>
